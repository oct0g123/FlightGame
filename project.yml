# XcodeGen spec for Glidepath. Run `xcodegen generate` after editing; the
# generated Glidepath.xcodeproj is not committed.
name: Glidepath

options:
  createIntermediateGroups: true
  developmentLanguage: en
  groupSortPosition: top
  deploymentTarget:
    iOS: "26.0"
    macOS: "26.0"
    visionOS: "26.0"

# Team ID and bundle ID prefix come from Config/Base.xcconfig, which includes
# your gitignored Config/Local.xcconfig.
configFiles:
  Debug: Config/Base.xcconfig
  Release: Config/Base.xcconfig

settings:
  base:
    SWIFT_VERSION: "6.0"
    SWIFT_APPROACHABLE_CONCURRENCY: YES
    LOCALIZATION_PREFERS_STRING_CATALOGS: YES
    SWIFT_EMIT_LOC_STRINGS: YES
    ENABLE_USER_SCRIPT_SANDBOXING: YES

packages:
  FlightCore:
    path: Packages/FlightCore
  FlightContent:
    path: Packages/FlightContent
  FlightScene:
    path: Packages/FlightScene
  FlightServices:
    path: Packages/FlightServices
  FlightUI:
    path: Packages/FlightUI

targets:
  Glidepath:
    type: application
    supportedDestinations: [iOS, macOS, visionOS]
    sources:
      - path: App
    dependencies:
      - package: FlightUI
    settings:
      base:
        PRODUCT_NAME: Glidepath
        PRODUCT_BUNDLE_IDENTIFIER: "$(BUNDLE_ID_PREFIX).glidepath"
        MARKETING_VERSION: "0.1.0"
        CURRENT_PROJECT_VERSION: "1"
        SWIFT_DEFAULT_ACTOR_ISOLATION: MainActor
        GENERATE_INFOPLIST_FILE: YES
        INFOPLIST_KEY_CFBundleDisplayName: Glidepath
        INFOPLIST_KEY_LSApplicationCategoryType: public.app-category.arcade-games

        # iPhone and iPad. iPhone plays in landscape only.
        "INFOPLIST_KEY_UIApplicationSceneManifest_Generation[sdk=iphone*]": YES
        "INFOPLIST_KEY_UIApplicationSupportsIndirectInputEvents[sdk=iphone*]": YES
        "INFOPLIST_KEY_UILaunchScreen_Generation[sdk=iphone*]": YES
        INFOPLIST_KEY_UISupportedInterfaceOrientations_iPhone: >-
          UIInterfaceOrientationLandscapeLeft UIInterfaceOrientationLandscapeRight
        INFOPLIST_KEY_UISupportedInterfaceOrientations_iPad: >-
          UIInterfaceOrientationPortrait UIInterfaceOrientationPortraitUpsideDown
          UIInterfaceOrientationLandscapeLeft UIInterfaceOrientationLandscapeRight

        # visionOS launches straight into the volume.
        "INFOPLIST_FILE[sdk=xros*]": Config/Info-visionOS.plist
        "INFOPLIST_FILE[sdk=xrsimulator*]": Config/Info-visionOS.plist

schemes:
  Glidepath:
    build:
      targets:
        Glidepath: all
    run:
      config: Debug
    profile:
      config: Release
    archive:
      config: Release
